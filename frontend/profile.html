<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChatMate - Profile</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
           background: #050505;
    color: #f5f5f5;
            display: flex;
            justify-content: center;
            padding: 35px 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 600px;
           background: linear-gradient(145deg, #111111, #080808);
            border: 1px solid #263449;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 30px 80px rgba(0,0,0,.5);
        }

        /* TOP */

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg,#2563eb,#4f46e5);
            color: white;
        }

        .back-btn {
            border: 1px solid #334155;
            background: rgba(255,255,255,.03);
            color: #cbd5e1;
            padding: 10px 13px;
            border-radius: 10px;
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(59,130,246,.12);
            border-color: #3b82f6;
        }

        /* PROFILE */

        .profile-main {
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: auto;
            border-radius: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg,#2563eb,#4f46e5);
            color: white;

            font-size: 30px;
            font-weight: 700;

            box-shadow: 0 12px 35px rgba(37,99,235,.35);
        }

        .profile-main h1 {
            margin-top: 18px;
            font-size: 25px;
            color: #f8fafc;
        }

        .profile-main p {
            margin-top: 7px;
            color: #64748b;
            font-size: 14px;
        }

        .online {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            margin-top: 12px;
            padding: 6px 11px;
            border-radius: 20px;
            background: rgba(34,197,94,.08);
            color: #4ade80;
            font-size: 12px;
        }

        .online i {
            font-size: 7px;
        }

        /* SECTION */

        .section-title {
            margin-top: 32px;
            margin-bottom: 12px;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* INFO */

        .info-box {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px;
            margin-bottom: 10px;

            background: rgba(255,255,255,.035);
            border: 1px solid #263449;
            border-radius: 14px;
        }

        .info-icon {
            width: 40px;
            height: 40px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;
            background: rgba(37,99,235,.12);
            color: #60a5fa;
        }

        .info-content {
            min-width: 0;
        }

        .info-label {
            display: block;
            font-size: 11px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .info-value {
            display: block;
            color: #e2e8f0;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* SETTINGS */

        .setting-box {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 15px;

            margin-bottom: 10px;

            background: rgba(255,255,255,.035);
            border: 1px solid #263449;
            border-radius: 14px;
        }

        .setting-left {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .setting-icon {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background: rgba(37,99,235,.12);
            color: #60a5fa;
        }

        .setting-text strong {
            display: block;
            color: #e2e8f0;
            font-size: 14px;
        }

        .setting-text span {
            display: block;
            color: #64748b;
            font-size: 11px;
            margin-top: 4px;
        }

        /* TOGGLE */

        .switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: #334155;
            cursor: pointer;
            transition: .25s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: .25s;
        }

        input:checked + .slider {
            background: #2563eb;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* LANGUAGE */

        .language-select {
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 9px;
            padding: 8px 10px;
            cursor: pointer;
            outline: none;
        }

        .language-select:focus {
            border-color: #3b82f6;
        }

        /* BUTTONS */

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .action-btn {
            flex: 1;
            padding: 13px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .chat-btn {
            border: none;
            background: linear-gradient(135deg,#2563eb,#4f46e5);
            color: white;
        }

        .chat-btn:hover {
            box-shadow: 0 8px 20px rgba(37,99,235,.25);
        }

        .logout-btn {
            border: 1px solid #7f1d1d;
            background: rgba(239,68,68,.06);
            color: #f87171;
        }

        .logout-btn:hover {
            background: rgba(239,68,68,.12);
        }

        /* LIGHT MODE */

        body.light-mode .info-box,
        body.light-mode .setting-box {
            background: #f8fafc;
            border-color: #e2e8f0;
        }

        body.light-mode .language-select {
            background: white;
            color: #0f172a;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .profile-card {
                padding: 22px 18px;
            }

            .actions {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

<div class="profile-card">

    <!-- TOP -->

    <div class="top-bar">

        <div class="brand">

            <div class="brand-icon">
                <i class="fa-solid fa-robot"></i>
            </div>

            <span>ChatMate</span>

        </div>

        <button class="back-btn" id="backBtn">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

    </div>


    <!-- PROFILE -->

    <div class="profile-main">

        <div class="avatar" id="profileAvatar">
            AS
        </div>

        <h1 id="profileName">
            User
        </h1>

        <p id="profileEmail">
            email@example.com
        </p>

        <div class="online">
            <i class="fa-solid fa-circle"></i>
            Account Active
        </div>

    </div>


    <!-- ACCOUNT INFORMATION -->

    <div class="section-title">
        Account Information
    </div>


    <div class="info-box">

        <div class="info-icon">
            <i class="fa-regular fa-user"></i>
        </div>

        <div class="info-content">

            <span class="info-label">
                Full Name
            </span>

            <span class="info-value" id="infoName">
                User
            </span>

        </div>

    </div>


    <div class="info-box">

        <div class="info-icon">
            <i class="fa-regular fa-envelope"></i>
        </div>

        <div class="info-content">

            <span class="info-label">
                Email Address
            </span>

            <span class="info-value" id="infoEmail">
                email@example.com
            </span>

        </div>

    </div>


    <div class="info-box">

        <div class="info-icon">
            <i class="fa-solid fa-id-card"></i>
        </div>

        <div class="info-content">

            <span class="info-label">
                User ID
            </span>

            <span class="info-value" id="infoId">
                -
            </span>

        </div>

    </div>


    <!-- SETTINGS -->

    <div class="section-title">
        Settings
    </div>


    <!-- APPEARANCE -->

    <div class="setting-box">

        <div class="setting-left">

            <div class="setting-icon">
                <i class="fa-solid fa-palette"></i>
            </div>

            <div class="setting-text">

                <strong>Appearance</strong>

                <span>Switch between dark and light mode</span>

            </div>

        </div>


        <label class="switch">

            <input type="checkbox" id="themeToggle">

            <span class="slider"></span>

        </label>

    </div>


    <!-- LANGUAGE -->

    <div class="setting-box">

        <div class="setting-left">

            <div class="setting-icon">
                <i class="fa-solid fa-language"></i>
            </div>

            <div class="setting-text">

                <strong>Language</strong>

                <span>Preferred ChatMate language</span>

            </div>

        </div>


        <select class="language-select" id="languageSelect">

            <option value="English">English</option>

            <option value="Hindi">Hindi</option>

            <option value="Marathi">Marathi</option>

        </select>

    </div>


    <!-- ACCOUNT -->

    <div class="setting-box">

        <div class="setting-left">

            <div class="setting-icon">
                <i class="fa-solid fa-user-gear"></i>
            </div>

            <div class="setting-text">

                <strong>Account</strong>

                <span>Manage your ChatMate account</span>

            </div>

        </div>

        <i class="fa-solid fa-chevron-right"
           style="color:#64748b;font-size:12px;">
        </i>

    </div>


    <!-- ACTIONS -->

    <div class="actions">

        <button class="action-btn chat-btn" id="chatBtn">

            <i class="fa-solid fa-message"></i>

            Back to Chat

        </button>


        <button class="action-btn logout-btn" id="logoutBtn">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </div>

</div>


<script>

    /* =====================================
       USER DATA
    ===================================== */

    const userId =
        localStorage.getItem("userId");

    const userName =
        localStorage.getItem("userName") || "User";

    const userEmail =
        localStorage.getItem("userEmail") || "";


    /* =====================================
       LOGIN CHECK
    ===================================== */

    if (!userId) {

        window.location.href = "login.html";

    }


    /* =====================================
       INITIALS
    ===================================== */

    function getInitials(name) {

        const words =
            name.trim().split(/\s+/);

        if (words.length === 1) {

            return words[0]
                .substring(0, 2)
                .toUpperCase();

        }

        return (
            words[0].charAt(0) +
            words[words.length - 1].charAt(0)
        ).toUpperCase();

    }


    const initials =
        getInitials(userName);


    /* =====================================
       DISPLAY USER
    ===================================== */

    document.getElementById(
        "profileAvatar"
    ).textContent = initials;


    document.getElementById(
        "profileName"
    ).textContent = userName;


    document.getElementById(
        "profileEmail"
    ).textContent = userEmail;


    document.getElementById(
        "infoName"
    ).textContent = userName;


    document.getElementById(
        "infoEmail"
    ).textContent = userEmail;


    document.getElementById(
        "infoId"
    ).textContent = "#" + userId;


    /* =====================================
       BACK TO CHAT
    ===================================== */

    document.getElementById(
        "backBtn"
    ).addEventListener(
        "click",
        function () {

            window.location.href =
                "index.html";

        }
    );


    document.getElementById(
        "chatBtn"
    ).addEventListener(
        "click",
        function () {

            window.location.href =
                "index.html";

        }
    );


    /* =====================================
       LOGOUT
    ===================================== */

    document.getElementById(
        "logoutBtn"
    ).addEventListener(
        "click",
        function () {

            localStorage.removeItem("userId");

            localStorage.removeItem("userName");

            localStorage.removeItem("userEmail");

            window.location.href =
                "login.html";

        }
    );


    /* =====================================
       APPEARANCE
    ===================================== */

    const themeToggle =
        document.getElementById("themeToggle");


    if (
        localStorage.getItem("chatmateTheme")
        === "light"
    ) {

        document.body.classList.add(
            "light-mode"
        );

        themeToggle.checked = true;

    }


    themeToggle.addEventListener(
        "change",
        function () {

            if (this.checked) {

                document.body.classList.add(
                    "light-mode"
                );

                localStorage.setItem(
                    "chatmateTheme",
                    "light"
                );

            } else {

                document.body.classList.remove(
                    "light-mode"
                );

                localStorage.setItem(
                    "chatmateTheme",
                    "dark"
                );

            }

        }
    );


    /* =====================================
       LANGUAGE
    ===================================== */

    const languageSelect =
        document.getElementById(
            "languageSelect"
        );


    const savedLanguage =
        localStorage.getItem(
            "chatmateLanguage"
        );


    if (savedLanguage) {

        languageSelect.value =
            savedLanguage;

    }


    languageSelect.addEventListener(
        "change",
        function () {

            localStorage.setItem(
                "chatmateLanguage",
                this.value
            );

        }
    );

</script>

</body>

</html>
