<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChatMate - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            font-family: Arial, sans-serif;
            color: white;
        }

        .login-box {
            width: 400px;
            padding: 35px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #475569;
            border-radius: 10px;
            background: #0f172a;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            color: #60a5fa;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
        }

        .register-link a {
            color: #60a5fa;
            text-decoration: none;
        }
        body {
    background: #050505;
    color: #f5f5f5;
    font-family: Arial, sans-serif;
}

.auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050505;
}

.auth-box {
    width: 390px;
    padding: 35px;
    background: #0d0d0d;
    border: 1px solid #252525;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
}

.auth-box h1 {
    text-align: center;
    margin-bottom: 8px;
}

.auth-box p {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-bottom: 25px;
}

.auth-box input,
.auth-box select {
    width: 100%;
    padding: 13px;
    margin-bottom: 12px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 9px;
    color: white;
    outline: none;
}

.auth-box input:focus,
.auth-box select:focus {
    border-color: #3b82f6;
}

.auth-box button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.auth-box button:hover {
    background: #1d4ed8;
}

.auth-box a {
    color: #3b82f6;
    text-decoration: none;
}
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🤖 ChatMate</div>

        <p class="subtitle">
            Welcome back!
        </p>

        <form id="loginForm">

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <p id="message"></p>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");


        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();


            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            message.textContent = "Logging in...";


            try {

                const response = await fetch(
                    "http://localhost:8082/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const result = await response.json();

if (result && result.id) {

    localStorage.setItem("userId", result.id);
    localStorage.setItem("userName", result.name);
    localStorage.setItem("userEmail", result.email);

    message.textContent = "Login successful!";

    setTimeout(function() {

        window.location.href = "index.html";

    }, 1000);

} else {

    message.textContent =
        "Invalid email or password!";
}


            } catch (error) {

                console.error(error);

                message.textContent =
                    "invalid password.";
            }

        });

    </script>

</body>

</html>
